  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #ff5c00; color: #111; }
    body { min-height: 100dvh; display: flex; flex-direction: column; background: linear-gradient(180deg,#ff7a1a,#ff5c00 60%,#e04800); }
    .hero { padding: calc(36px + env(safe-area-inset-top)) 24px 20px; text-align: center; color: #fff; }
    .logo { width: 92px; height: 92px; border-radius: 24px; display: block; margin: 0 auto; box-shadow: 0 10px 24px rgba(0,0,0,.18); }
    h1 { margin: 16px 0 6px; font-size: 22px; }
    .hero p { margin: 0; opacity: .8; font-size: 14px; }
    form { margin-top: auto; background: #fff; border-radius: 28px 28px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); }
    h2 { margin: 0 0 6px; font-size: 26px; }
    .sub { margin: 0 0 20px; color: #6b7280; font-size: 14px; }
    label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 700; }
    input {
      width: 100%; height: 52px; margin: 0 0 14px; padding: 0 14px;
      border: 1px solid #e5e7eb; border-radius: 12px; background: #fff;
      font-size: 16px; color: #111; -webkit-appearance: none; appearance: none;
    }
    input:focus { outline: 2px solid #ff5c00; border-color: #ff5c00; }
    .err { display: none; color: #b91c1c; background: #fef2f2; padding: 10px 12px; border-radius: 10px; margin: 0 0 12px; font-size: 13px; }
    .err.show { display: block; }
    button { width: 100%; height: 52px; border: 0; border-radius: 12px; background: #ff5c00; color: #fff; font-size: 16px; font-weight: 700; }
    button:disabled { opacity: .55; }
    .foot { margin: 14px 0 0; text-align: center; color: #9ca3af; font-size: 12px; }
  </style>

    <h1>Quản lý bán hàng</h1>
    <p>Sản phẩm · Tồn kho · Đơn hàng</p>
  </div>
  <form id="form" action="javascript:void(0)">
    <h2>Đăng nhập</h2>
    <p class="sub">Tài khoản do cửa hàng cấp</p>
    <label for="login">Email hoặc số điện thoại</label>
    <input id="login" name="username" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="admin@kieumi.vn" required>
    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required>
    <div class="err" id="err"></div>
    <button type="submit" id="btn">Tiếp tục</button>
    <p class="foot">Kiều Mi · Nội bộ cửa hàng</p>
  </form>
  <script>
    var form = document.getElementById('form');
    var login = document.getElementById('login');
    var password = document.getElementById('password');
    var err = document.getElementById('err');
    var btn = document.getElementById('btn');
    try {
      if (localStorage.getItem('flutter.auth_token') && !/app\.html$/i.test(location.pathname)) {
        location.replace('app.html');
      }
    } catch (e) {}
    form.onsubmit = async function (e) {
      e.preventDefault();
      err.className = 'err';
      btn.disabled = true;
      btn.textContent = 'Đang vào...';
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 20000);
      try {
        var res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: login.value.trim(), password: password.value }),
          signal: ctrl.signal
        });
        var json = await res.json().catch(function () { return {}; });
        if (!res.ok || json.success === false) {
          var first = json.errors && (json.errors.login || json.errors.password);
          throw new Error((first && first[0]) || json.message || 'Đăng nhập thất bại');
        }
        var data = json.data || {};
        var user = data.user || {};
        localStorage.setItem('flutter.auth_token', JSON.stringify(data.token || ''));
        localStorage.setItem('flutter.auth_user', JSON.stringify(JSON.stringify({
          id: user.id, name: user.name, email: user.email, phone: user.phone, role: user.role, is_active: user.is_active
        })));
        location.replace('app.html');
      } catch (ex) {
        err.textContent = (ex && ex.name === 'AbortError')
          ? 'Máy chủ phản hồi chậm. Thử lại.'
          : (ex.message || 'Không kết nối được máy chủ.');
        err.className = 'err show';
        btn.disabled = false;
        btn.textContent = 'Tiếp tục';
      } finally {
        clearTimeout(timer);
      }
    };
  </script>
</body>
</html>
