<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bán hàng">
  <meta name="theme-color" content="#0E2A4A">
  <title>Quản lý bán hàng</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/km-192.png">
  <style>
    :root { --orange:#FF6A00; --blue:#2F7BFF; --bg:#F3F7FB; --text:#1C1C1E; --muted:#8E8E93; --line:#E5EAF0; --ok:#34C759; --bad:#FF3B30; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    button, input, select, textarea { font: inherit; }
    input, select, textarea { width: 100%; height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 16px; }
    textarea { height: auto; min-height: 84px; padding: 12px; }
    .hidden { display: none !important; }
    #app { min-height: 100dvh; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    .hero { background: linear-gradient(135deg, #0E2A4A, #1A4A8A 55%, #2563EB); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 20px 22px; border-radius: 0 0 24px 24px; }
    .hero .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .hero .greet { margin: 18px 0 0; opacity: .75; font-size: 13px; }
    .hero h1 { margin: 4px 0 0; font-size: 24px; }
    .hero .role { margin: 4px 0 0; opacity: .7; font-size: 13px; }
    .page { padding: 16px 16px 8px; }
    .page h2 { margin: 0 0 12px; font-size: 20px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: -8px; }
    .card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 6px 18px rgba(16, 36, 64, .06); }
    .stat .k { color: var(--muted); font-size: 12px; }
    .stat .v { margin-top: 6px; font-size: 18px; font-weight: 800; }
    .section { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; }
    .section h3 { margin: 0; font-size: 16px; }
    .section button { border: 0; background: 0; color: var(--blue); font-weight: 700; padding: 0; }
    .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick button { height: 54px; border: 0; border-radius: 14px; background: #fff; font-weight: 700; box-shadow: 0 6px 18px rgba(16, 36, 64, .06); }
    .row { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row b { display: block; }
    .muted { color: var(--muted); font-size: 13px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .ok { background: #e8f8ee; color: #167a38; }
    .bad { background: #fde8e7; color: #b42318; }
    .warn { color: var(--orange); font-weight: 700; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 6px 18px rgba(16, 36, 64, .06); }
    .search { margin: 0 0 12px; }
    .btn { width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--orange); color: #fff; font-weight: 800; }
    .btn.sec { background: #eef2f7; color: var(--text); }
    .btn.danger { background: var(--bad); }
    .btn[disabled] { opacity: .55; }
    .fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--orange); color: #fff; font-size: 30px; line-height: 1; box-shadow: 0 10px 20px rgba(255,106,0,.28); }
    nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: #fff; display: grid; grid-template-columns: repeat(5, 1fr); box-shadow: 0 -8px 24px rgba(0,0,0,.08); }
    nav button { border: 0; background: 0; color: var(--muted); font-size: 11px; font-weight: 600; }
    nav button.on { color: var(--blue); font-weight: 800; }
    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; }
    .sheet .box { width: 100%; max-height: 92dvh; overflow: auto; background: #fff; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    .sheet h3 { margin: 0 0 12px; }
    .field { margin: 0 0 12px; }
    .field label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 700; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); background: #111; color: #fff; padding: 12px 14px; border-radius: 12px; z-index: 30; }
    .empty { padding: 28px 8px; text-align: center; color: var(--muted); }
    .line { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; }
    .line input { flex: 1; }
    .line button { height: 48px; width: 44px; border: 0; border-radius: 12px; background: #eef2f7; font-size: 20px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <button id="fab" class="fab hidden" type="button">+</button>
  <nav id="nav"></nav>
  <div id="sheet" class="sheet hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script>
    var token = readPref('auth_token');
    var user = readPref('auth_user', true) || {};
    if (!token) location.replace('/');

    var tab = 'home';
    var cache = { dash: null, orders: [], products: [], stock: [], users: [] };

    function readPref(key, asObject) {
      try {
        var raw = localStorage.getItem('flutter.' + key);
        if (!raw) return asObject ? null : '';
        var v = JSON.parse(raw);
        if (typeof v === 'string') {
          if (!asObject) return v;
          try { return JSON.parse(v); } catch (e) { return null; }
        }
        return asObject ? (v || null) : String(v || '');
      } catch (e) {
        return asObject ? null : '';
      }
    }

    function money(n) {
      return Number(n || 0).toLocaleString('vi-VN') + 'đ';
    }
    function greet() {
      var h = new Date().getHours();
      return h < 12 ? 'Chào buổi sáng' : h < 18 ? 'Chào buổi chiều' : 'Chào buổi tối';
    }
    function when(s) {
      if (!s) return '';
      var d = new Date(s);
      if (isNaN(d)) return s;
      return d.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
    }
    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.classList.add('hidden'); }, 2200);
    }
    function statusBadge(st) {
      return st === 'cancelled' ? '<span class="badge bad">Đã hủy</span>' : '<span class="badge ok">Hoàn tất</span>';
    }
    function firstErr(json, fallback) {
      if (json && json.errors) {
        var k = Object.keys(json.errors)[0];
        if (k && json.errors[k] && json.errors[k][0]) return json.errors[k][0];
      }
      return (json && json.message) || fallback || 'Thất bại';
    }

    async function api(path, opt) {
      opt = opt || {};
      var headers = { Accept: 'application/json', Authorization: 'Bearer ' + token };
      if (opt.body && !(opt.body instanceof FormData) && !opt.raw) headers['Content-Type'] = 'application/json';
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, 20000);
      var res, json = {};
      try {
        res = await fetch('/api' + path, {
          method: opt.method || 'GET',
          headers: headers,
          body: opt.body ? (opt.body instanceof FormData ? opt.body : JSON.stringify(opt.body)) : undefined,
          signal: ctrl.signal
        });
        json = await res.json().catch(function () { return {}; });
      } finally {
        clearTimeout(t);
      }
      if (res && res.status === 401) {
        localStorage.removeItem('flutter.auth_token');
        localStorage.removeItem('flutter.auth_user');
        location.replace('/');
        throw new Error('Hết phiên đăng nhập');
      }
      if (!res || !res.ok || json.success === false) throw new Error(firstErr(json, 'Không kết nối được máy chủ'));
      return json;
    }

    function navHtml() {
      var items = [
        ['home', 'Tổng quan'],
        ['orders', 'Đơn hàng'],
        ['products', 'Sản phẩm'],
        ['stock', 'Kho'],
        ['more', 'Thêm']
      ];
      return items.map(function (it) {
        return '<button type="button" data-tab="' + it[0] + '" class="' + (tab === it[0] ? 'on' : '') + '">' + it[1] + '</button>';
      }).join('');
    }

    function render() {
      document.getElementById('nav').innerHTML = navHtml();
      document.getElementById('fab').classList.toggle('hidden', tab !== 'orders' && tab !== 'products' && tab !== 'stock');
      var app = document.getElementById('app');
      if (tab === 'home') app.innerHTML = viewHome();
      else if (tab === 'orders') app.innerHTML = viewOrders();
      else if (tab === 'products') app.innerHTML = viewProducts();
      else if (tab === 'stock') app.innerHTML = viewStock();
      else app.innerHTML = viewMore();
    }

    function viewHome() {
      var d = cache.dash;
      var name = user.name || 'Bạn';
      var role = user.role === 'admin' ? 'Quản trị' : 'Nhân viên';
      var body = '<div class="page"><div class="empty">Đang tải tổng quan...</div></div>';
      if (d) {
        body = '<div class="page">' +
          '<div class="stats">' +
            stat('Doanh thu hôm nay', money(d.today_revenue)) +
            stat('Doanh thu tháng', money(d.month_revenue)) +
            stat('Đơn hôm nay', d.today_orders) +
            stat('Sản phẩm', d.product_count) +
          '</div>' +
          '<div class="section"><h3>Thao tác nhanh</h3></div>' +
          '<div class="quick">' +
            '<button type="button" data-go="new-order">Tạo đơn</button>' +
            '<button type="button" data-go="new-product">Thêm sản phẩm</button>' +
            '<button type="button" data-tab="orders">Đơn hàng</button>' +
            '<button type="button" data-tab="stock">Nhập kho</button>' +
          '</div>' +
          '<div class="section"><h3>Đơn gần đây</h3><button type="button" data-tab="orders">Tất cả</button></div>' +
          orderList(d.recent_orders || []) +
          '<div class="section"><h3>Sắp hết hàng</h3><button type="button" data-tab="stock">Kho</button></div>' +
          lowStock(d.low_stock || []) +
        '</div>';
      } else if (cache.homeErr) {
        body = '<div class="page"><div class="empty">' + esc(cache.homeErr) + '<br>Chạm Tổng quan để thử lại.</div></div>';
      }
      return '<div class="hero"><div class="top"><span>QUẢN LÝ BÁN HÀNG</span><span>Kiều Mi</span></div>' +
        '<p class="greet">' + greet() + '</p><h1>' + esc(name) + '</h1><p class="role">' + role + '</p></div>' + body;
    }
    function stat(k, v) {
      return '<div class="card stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
    }
    function orderList(items) {
      if (!items.length) return '<div class="card empty">Chưa có đơn hàng nào.</div>';
      return '<div class="list">' + items.map(function (o) {
        return '<button type="button" class="item" data-order="' + o.id + '" style="text-align:left;border:0;width:100%">' +
          '<div class="row" style="padding:0;border:0"><div><b>' + esc(o.code) + '</b><div class="muted">' + esc(o.customer_name || 'Khách lẻ') + ' · ' + (o.item_count || 0) + ' món</div></div>' +
          '<div style="text-align:right"><b>' + money(o.total_amount) + '</b><div>' + statusBadge(o.status) + '</div></div></div></button>';
      }).join('') + '</div>';
    }
    function lowStock(items) {
      if (!items.length) return '<div class="card empty">Chưa có sản phẩm sắp hết.</div>';
      return '<div class="card">' + items.map(function (p) {
        return '<div class="row"><div><b>' + esc(p.name) + '</b><div class="muted">' + money(p.listed_price) + '</div></div><div class="warn">Còn ' + p.stock_qty + '</div></div>';
      }).join('') + '</div>';
    }

    function viewOrders() {
      return '<div class="page"><h2>Đơn hàng</h2><input class="search" id="q-orders" placeholder="Tìm mã đơn, khách hàng">' +
        (cache.orders.length ? orderList(cache.orders) : '<div class="empty">Đang tải đơn hàng...</div>') + '</div>';
    }
    function viewProducts() {
      var rows = cache.products.map(function (p) {
        return '<button type="button" class="item" data-product="' + p.id + '" style="text-align:left;border:0;width:100%">' +
          '<div class="row" style="padding:0;border:0"><div><b>' + esc(p.name) + '</b><div class="muted">' + esc(p.sku || 'Không mã') + ' · ' + money(p.listed_price) + '</div></div>' +
          '<div style="text-align:right"><b>Kho ' + p.stock_qty + '</b><div class="muted">' + (p.is_active ? 'Đang bán' : 'Đã ẩn') + '</div></div></div></button>';
      }).join('');
      return '<div class="page"><h2>Sản phẩm</h2><input class="search" id="q-products" placeholder="Tìm tên, mã SKU">' +
        (rows || '<div class="empty">Đang tải sản phẩm...</div>') + '</div>';
    }
    function viewStock() {
      var rows = cache.stock.map(function (s) {
        return '<div class="item"><div class="row" style="padding:0;border:0"><div><b>' + esc(s.product_name || 'Sản phẩm') + '</b><div class="muted">' + when(s.created_at) + (s.note ? ' · ' + esc(s.note) : '') + '</div></div><div class="warn">+' + s.quantity + '</div></div></div>';
      }).join('');
      return '<div class="page"><h2>Nhập kho</h2>' + (rows || '<div class="empty">Đang tải phiếu nhập...</div>') + '</div>';
    }
    function viewMore() {
      var admin = user.role === 'admin';
      return '<div class="page"><h2>Thêm</h2>' +
        '<div class="card"><b>' + esc(user.name || '') + '</b><div class="muted">' + esc(user.email || '') + ' · ' + (admin ? 'Quản trị' : 'Nhân viên') + '</div></div>' +
        '<div class="list" style="margin-top:12px">' +
          '<button type="button" class="item" data-go="new-order">Tạo đơn hàng</button>' +
          '<button type="button" class="item" data-go="new-product">Thêm sản phẩm</button>' +
          '<button type="button" class="item" data-go="new-stock">Nhập kho</button>' +
          (admin ? '<button type="button" class="item" data-go="users">Tài khoản nhân viên</button>' : '') +
          '<button type="button" class="item" data-go="logout">Đăng xuất</button>' +
        '</div></div>';
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function openSheet(html) {
      var el = document.getElementById('sheet');
      el.innerHTML = '<div class="box">' + html + '</div>';
      el.classList.remove('hidden');
    }
    function closeSheet() {
      document.getElementById('sheet').classList.add('hidden');
      document.getElementById('sheet').innerHTML = '';
    }

    async function loadHome() {
      try {
        cache.homeErr = null;
        var json = await api('/dashboard');
        cache.dash = json.data || {};
      } catch (e) {
        cache.homeErr = e.message;
      }
      if (tab === 'home') render();
    }
    async function loadOrders(q) {
      var json = await api('/orders?per_page=40' + (q ? '&q=' + encodeURIComponent(q) : ''));
      cache.orders = json.data || [];
      if (tab === 'orders') render();
    }
    async function loadProducts(q) {
      var json = await api('/products?per_page=50' + (q ? '&q=' + encodeURIComponent(q) : ''));
      cache.products = json.data || [];
      if (tab === 'products') render();
    }
    async function loadStock() {
      var json = await api('/stock-imports?per_page=40');
      cache.stock = json.data || [];
      if (tab === 'stock') render();
    }

    function productOptions(selected) {
      return cache.products.filter(function (p) { return p.is_active; }).map(function (p) {
        return '<option value="' + p.id + '" ' + (String(selected) === String(p.id) ? 'selected' : '') + '>' + esc(p.name) + ' · kho ' + p.stock_qty + '</option>';
      }).join('');
    }

    function showNewOrder() {
      if (!cache.products.length) {
        loadProducts().then(showNewOrder).catch(function (e) { toast(e.message); });
        return;
      }
      openSheet(
        '<h3>Tạo đơn hàng</h3>' +
        '<div class="field"><label>Khách hàng</label><input id="o-name" placeholder="Khách lẻ"></div>' +
        '<div class="field"><label>Số điện thoại</label><input id="o-phone" inputmode="tel" placeholder="090..."></div>' +
        '<div id="o-items"><div class="line"><select class="o-p">' + productOptions() + '</select><input class="o-q" inputmode="numeric" value="1" style="max-width:72px"><button type="button" data-go="add-line">+</button></div></div>' +
        '<div class="field"><label>Ghi chú</label><textarea id="o-note"></textarea></div>' +
        '<button class="btn" id="o-save" type="button">Lưu đơn</button>' +
        '<div style="height:8px"></div><button class="btn sec" type="button" data-go="close">Đóng</button>'
      );
    }

    function showNewProduct(p) {
      p = p || {};
      openSheet(
        '<h3>' + (p.id ? 'Sửa sản phẩm' : 'Thêm sản phẩm') + '</h3>' +
        '<div class="field"><label>Tên</label><input id="p-name" value="' + esc(p.name || '') + '" required></div>' +
        '<div class="field"><label>Giá bán</label><input id="p-price" inputmode="numeric" value="' + (p.listed_price || '') + '"></div>' +
        '<div class="field"><label>Mã SKU</label><input id="p-sku" value="' + esc(p.sku || '') + '"></div>' +
        (p.id ? '' : '<div class="field"><label>Tồn kho ban đầu</label><input id="p-qty" inputmode="numeric" value="0"></div>') +
        '<div class="field"><label>Ghi chú</label><textarea id="p-note">' + esc(p.note || '') + '</textarea></div>' +
        '<div class="field"><label>Ảnh</label><input id="p-image" type="file" accept="image/*"></div>' +
        '<button class="btn" type="button" data-save-product="' + (p.id || '') + '">Lưu</button>' +
        (p.id ? '<div style="height:8px"></div><button class="btn danger" type="button" data-del-product="' + p.id + '">Xóa / ẩn</button>' : '') +
        '<div style="height:8px"></div><button class="btn sec" type="button" data-go="close">Đóng</button>'
      );
    }

    function showNewStock() {
      if (!cache.products.length) {
        loadProducts().then(showNewStock).catch(function (e) { toast(e.message); });
        return;
      }
      openSheet(
        '<h3>Nhập kho</h3>' +
        '<div class="field"><label>Sản phẩm</label><select id="s-p">' + productOptions() + '</select></div>' +
        '<div class="field"><label>Số lượng</label><input id="s-q" inputmode="numeric" value="1"></div>' +
        '<div class="field"><label>Ghi chú</label><input id="s-note"></div>' +
        '<button class="btn" id="s-save" type="button">Nhập kho</button>' +
        '<div style="height:8px"></div><button class="btn sec" type="button" data-go="close">Đóng</button>'
      );
    }

    async function showOrder(id) {
      try {
        var json = await api('/orders/' + id);
        var o = json.data || {};
        var items = (o.items || []).map(function (it) {
          return '<div class="row"><div><b>' + esc(it.product_name) + '</b><div class="muted">x' + it.quantity + ' · ' + money(it.sale_price) + '</div></div><b>' + money(it.line_total) + '</b></div>';
        }).join('');
        openSheet(
          '<h3>' + esc(o.code) + '</h3>' +
          '<div class="muted">' + esc(o.customer_name || 'Khách lẻ') + (o.customer_phone ? ' · ' + esc(o.customer_phone) : '') + '</div>' +
          '<div style="margin:8px 0">' + statusBadge(o.status) + ' · ' + money(o.total_amount) + '</div>' +
          '<div class="card">' + (items || 'Không có món') + '</div>' +
          (o.status !== 'cancelled' ? '<div style="height:12px"></div><button class="btn danger" type="button" data-cancel="' + o.id + '">Hủy đơn, hoàn kho</button>' : '') +
          '<div style="height:8px"></div><button class="btn sec" type="button" data-go="close">Đóng</button>'
        );
      } catch (e) {
        toast(e.message);
      }
    }

    async function showUsers() {
      try {
        var json = await api('/users?per_page=40');
        cache.users = json.data || [];
        var rows = cache.users.map(function (u) {
          return '<div class="row"><div><b>' + esc(u.name) + '</b><div class="muted">' + esc(u.email) + ' · ' + (u.role === 'admin' ? 'Quản trị' : 'Nhân viên') + '</div></div></div>';
        }).join('');
        openSheet(
          '<h3>Tài khoản</h3>' +
          '<div class="card">' + (rows || 'Chưa có tài khoản') + '</div>' +
          '<div style="height:12px"></div>' +
          '<div class="field"><label>Tên</label><input id="u-name"></div>' +
          '<div class="field"><label>Email</label><input id="u-email" type="email"></div>' +
          '<div class="field"><label>Mật khẩu</label><input id="u-pass" type="password"></div>' +
          '<div class="field"><label>Vai trò</label><select id="u-role"><option value="staff">Nhân viên</option><option value="admin">Quản trị</option></select></div>' +
          '<button class="btn" id="u-save" type="button">Tạo tài khoản</button>' +
          '<div style="height:8px"></div><button class="btn sec" type="button" data-go="close">Đóng</button>'
        );
      } catch (e) {
        toast(e.message);
      }
    }

    async function logout() {
      try { await api('/logout', { method: 'POST', body: {} }); } catch (e) {}
      localStorage.removeItem('flutter.auth_token');
      localStorage.removeItem('flutter.auth_user');
      location.replace('/');
    }

    document.getElementById('nav').onclick = function (e) {
      var b = e.target.closest('[data-tab]');
      if (!b) return;
      tab = b.getAttribute('data-tab');
      render();
      if (tab === 'home') loadHome();
      if (tab === 'orders') loadOrders().catch(function (err) { toast(err.message); });
      if (tab === 'products') loadProducts().catch(function (err) { toast(err.message); });
      if (tab === 'stock') loadStock().catch(function (err) { toast(err.message); });
    };

    document.getElementById('fab').onclick = function () {
      if (tab === 'orders') showNewOrder();
      if (tab === 'products') showNewProduct();
      if (tab === 'stock') showNewStock();
    };

    document.getElementById('app').onclick = function (e) {
      var t = e.target.closest('[data-tab],[data-go],[data-order],[data-product]');
      if (!t) return;
      if (t.dataset.tab) {
        tab = t.dataset.tab;
        render();
        if (tab === 'orders') loadOrders().catch(function (err) { toast(err.message); });
        if (tab === 'stock') loadStock().catch(function (err) { toast(err.message); });
        return;
      }
      if (t.dataset.order) return showOrder(t.dataset.order);
      if (t.dataset.product) {
        var p = cache.products.find(function (x) { return String(x.id) === t.dataset.product; });
        return showNewProduct(p || { id: t.dataset.product });
      }
      if (t.dataset.go === 'new-order') return showNewOrder();
      if (t.dataset.go === 'new-product') return showNewProduct();
      if (t.dataset.go === 'new-stock') return showNewStock();
      if (t.dataset.go === 'users') return showUsers();
      if (t.dataset.go === 'logout') return logout();
    };

    document.getElementById('app').oninput = function (e) {
      if (e.target.id === 'q-orders') {
        clearTimeout(e.target._t);
        e.target._t = setTimeout(function () { loadOrders(e.target.value.trim()).catch(function (err) { toast(err.message); }); }, 300);
      }
      if (e.target.id === 'q-products') {
        clearTimeout(e.target._t);
        e.target._t = setTimeout(function () { loadProducts(e.target.value.trim()).catch(function (err) { toast(err.message); }); }, 300);
      }
    };

    document.getElementById('sheet').onclick = async function (e) {
      var t = e.target.closest('[data-go],[data-cancel],[data-save-product],[data-del-product],#o-save,#s-save,#u-save');
      if (!t) return;
      if (t.dataset.go === 'close') return closeSheet();
      if (t.dataset.go === 'add-line') {
        var wrap = document.getElementById('o-items');
        var div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = '<select class="o-p">' + productOptions() + '</select><input class="o-q" inputmode="numeric" value="1" style="max-width:72px"><button type="button" data-go="add-line">+</button>';
        wrap.appendChild(div);
        return;
      }
      if (t.id === 'o-save') {
        t.disabled = true;
        try {
          var items = [].slice.call(document.querySelectorAll('#o-items .line')).map(function (line) {
            var pid = line.querySelector('.o-p').value;
            var p = cache.products.find(function (x) { return String(x.id) === String(pid); }) || {};
            return { product_id: Number(pid), quantity: Number(line.querySelector('.o-q').value || 1), sale_price: Number(p.listed_price || 0) };
          });
          await api('/orders', { method: 'POST', body: {
            customer_name: document.getElementById('o-name').value.trim() || null,
            customer_phone: document.getElementById('o-phone').value.trim() || null,
            note: document.getElementById('o-note').value.trim() || null,
            items: items
          }});
          closeSheet();
          toast('Đã tạo đơn hàng');
          loadHome(); loadOrders(); loadProducts();
        } catch (err) { toast(err.message); t.disabled = false; }
        return;
      }
      if (t.dataset.cancel) {
        if (!confirm('Hủy đơn này và hoàn kho?')) return;
        try {
          await api('/orders/' + t.dataset.cancel + '/cancel', { method: 'POST', body: {} });
          closeSheet();
          toast('Đã hủy đơn');
          loadHome(); loadOrders(); loadProducts();
        } catch (err) { toast(err.message); }
        return;
      }
      if (t.dataset.saveProduct !== undefined) {
        t.disabled = true;
        try {
          var fd = new FormData();
          fd.append('name', document.getElementById('p-name').value.trim());
          fd.append('listed_price', document.getElementById('p-price').value || '0');
          fd.append('sku', document.getElementById('p-sku').value.trim());
          fd.append('note', document.getElementById('p-note').value.trim());
          fd.append('is_active', '1');
          var qty = document.getElementById('p-qty');
          if (qty) fd.append('initial_qty', qty.value || '0');
          var img = document.getElementById('p-image').files[0];
          if (img) fd.append('image', img);
          var id = t.dataset.saveProduct;
          await api(id ? '/products/' + id : '/products', { method: 'POST', body: fd });
          closeSheet();
          toast('Đã lưu sản phẩm');
          loadProducts(); loadHome();
        } catch (err) { toast(err.message); t.disabled = false; }
        return;
      }
      if (t.dataset.delProduct) {
        if (!confirm('Xóa hoặc ẩn sản phẩm này?')) return;
        try {
          await api('/products/' + t.dataset.delProduct, { method: 'DELETE' });
          closeSheet();
          toast('Đã xử lý sản phẩm');
          loadProducts(); loadHome();
        } catch (err) { toast(err.message); }
        return;
      }
      if (t.id === 's-save') {
        t.disabled = true;
        try {
          await api('/stock-imports', { method: 'POST', body: {
            product_id: Number(document.getElementById('s-p').value),
            quantity: Number(document.getElementById('s-q').value || 1),
            note: document.getElementById('s-note').value.trim() || null
          }});
          closeSheet();
          toast('Đã nhập kho');
          loadStock(); loadProducts(); loadHome();
        } catch (err) { toast(err.message); t.disabled = false; }
        return;
      }
      if (t.id === 'u-save') {
        t.disabled = true;
        try {
          await api('/users', { method: 'POST', body: {
            name: document.getElementById('u-name').value.trim(),
            email: document.getElementById('u-email').value.trim(),
            password: document.getElementById('u-pass').value,
            role: document.getElementById('u-role').value
          }});
          toast('Đã tạo tài khoản');
          showUsers();
        } catch (err) { toast(err.message); t.disabled = false; }
      }
    };

    render();
    loadHome();
    loadProducts().catch(function () {});
  </script>
</body>
</html>
